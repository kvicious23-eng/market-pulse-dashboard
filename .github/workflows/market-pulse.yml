name: Market Pulse Update

on:
  workflow_dispatch:
    inputs:
      scan_mode:
        description: Scan mode
        required: true
        default: precision
        type: choice
        options: [daily, precision]
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - ".github/workflows/market-pulse.yml"
      - "scripts/update-market-data.mjs"
      - "index.html"
      - "acer/**"
      - "brand/**"
      - "dist/**"
      - "scripts/update-acer-data.mjs"
      - "scripts/validate-market-data.mjs"
      - "scripts/test-discount-rules.mjs"
      - "scripts/test-price-sources.mjs"
      - "scripts/test-history-export.mjs"
      - "scripts/test-history-corrections.ps1"
      - "scripts/apply-history-corrections.ps1"
      - "scripts/history-corrections.json"
      - "scripts/test-competitor-policy.mjs"
      - "scripts/test-competitor-history.mjs"
      - "scripts/test-canonical-routes.mjs"
      - "scripts/import-extension-results.ps1"
      - "scripts/run-scheduled-upload.ps1"
      - "scripts/set-local-schedule.ps1"
      - "chrome-extension/**"
      - "PROJECT_RULES.md"
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: market-pulse
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    outputs:
      deploy_sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Choose scan mode
        id: mode
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.scan_mode }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=precision" >> "$GITHUB_OUTPUT"
          fi
      - name: Run market scan
        if: github.event_name == 'workflow_dispatch'
        env:
          SCAN_MODE: ${{ steps.mode.outputs.value }}
        run: node scripts/update-market-data.mjs
      - name: Run Acer market scan
        if: github.event_name == 'workflow_dispatch'
        env:
          SCAN_MODE: ${{ steps.mode.outputs.value }}
        run: node scripts/update-acer-data.mjs
      - name: Check JavaScript syntax
        shell: bash
        run: |
          node --check dist/app.js
          node --check dist/xlsx-export.js
          node --check chrome-extension/background.js
          node --check chrome-extension/fallback.js
          node --check chrome-extension/options.js
          node --check chrome-extension/popup.js
          node --check scripts/validate-market-data.mjs
          node --check scripts/test-discount-rules.mjs
          node --check scripts/test-history-export.mjs
          node --check scripts/test-competitor-policy.mjs
          node --check scripts/test-competitor-history.mjs
          node --check scripts/test-canonical-routes.mjs
          node --check scripts/update-market-data.mjs
          node --check scripts/update-acer-data.mjs
      - name: Check PowerShell syntax
        shell: pwsh
        run: |
          $failed=$false
          Get-ChildItem scripts -Filter '*.ps1' | ForEach-Object {
            $tokens=$null
            $errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$errors)
            if ($errors.Count -gt 0) {
              $failed=$true
              $errors | ForEach-Object { Write-Error "$($_.Extent.File):$($_.Extent.StartLineNumber) $($_.Message)" }
            }
          }
          if ($failed) { exit 1 }
      - name: Validate dashboard data
        run: |
          node scripts/validate-market-data.mjs
          node scripts/test-discount-rules.mjs
          node scripts/test-price-sources.mjs
          node scripts/test-history-export.mjs
          node scripts/test-competitor-policy.mjs
          node scripts/test-competitor-history.mjs
          node scripts/test-canonical-routes.mjs
      - name: Verify audited history correction
        shell: pwsh
        run: ./scripts/test-history-corrections.ps1
      - name: Commit refreshed data
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          if git diff --quiet -- brand; then exit 0; fi
          git config user.name "market-pulse-bot"
          git config user.email "market-pulse-bot@users.noreply.github.com"
          git add brand
          git commit -m "data: refresh market scan"
          git pull --rebase origin main
          git push
      - name: Select validated revision
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  windows_history:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - name: Verify audited CSV repair in Windows PowerShell 5.1
        shell: powershell
        run: |
          if ($PSVersionTable.PSVersion.Major -ne 5) { throw 'Windows PowerShell 5.1 is required.' }
          $path=Join-Path $PWD 'scripts\edge-fallback.ps1'
          $bytes=[IO.File]::ReadAllBytes($path)
          if ($bytes.Length -lt 3 -or $bytes[0] -ne 239 -or $bytes[1] -ne 187 -or $bytes[2] -ne 191) { throw 'Edge fallback script needs UTF-8 BOM.' }
          $tokens=$null; $errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile($path,[ref]$tokens,[ref]$errors)
          if ($errors.Count) { throw ($errors | Out-String) }
          ./scripts/test-history-corrections.ps1

  deploy:
    needs: [update, windows_history]
    if: always() && github.event_name != 'pull_request' && needs.update.result == 'success' && needs.windows_history.result == 'success'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.update.outputs.deploy_sha }}
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v5

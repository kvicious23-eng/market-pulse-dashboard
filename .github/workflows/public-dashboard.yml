name: Market Pulse External Dashboard

on:
  workflow_dispatch:
    inputs:
      retire_legacy:
        description: Refresh the redirect-only legacy project once
        type: boolean
        default: false
  workflow_run:
    workflows: [Market Pulse Update]
    types: [completed]
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/public-dashboard.yml
      - config/legacy-public-retirement.json
      - scripts/retire-legacy-public.mjs
      - scripts/test-legacy-retirement.mjs
      - scripts/public-brand-hosts.mjs
      - scripts/brand-public-sites.mjs
      - scripts/test-brand-public-sites.mjs
      - scripts/build-public-dashboard.mjs
      - scripts/test-public-dashboard.mjs
      - scripts/verify-public-dashboard.mjs

permissions:
  contents: read

concurrency:
  group: market-pulse-external
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: |
          node scripts/test-public-dashboard.mjs
          node scripts/test-brand-public-sites.mjs
          node scripts/test-legacy-retirement.mjs

  publish:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.event != 'pull_request')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: d3e534928c9ef350bb0b435d689bb4c0
    steps:
      - name: Require deployment configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo '::error::External publishing is not connected: add CLOUDFLARE_API_TOKEN to repository Actions secrets.'
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Validate external exporter
        run: |
          node scripts/test-public-dashboard.mjs
          node scripts/test-brand-public-sites.mjs
          node scripts/test-legacy-retirement.mjs
      - name: Build from the currently published internal dashboard
        run: node scripts/build-public-dashboard.mjs publicmp
      - name: Build independent brand sites
        run: node scripts/brand-public-sites.mjs build publicmp brand-publicmp
      - name: Install Cloudflare deploy CLI
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: --version
      - name: Publish and verify independent brand sites
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/brand-public-sites.mjs publish brand-publicmp
      - name: Detect explicitly requested legacy transition
        id: legacy
        env:
          MANUAL_RETIRE: ${{ inputs.retire_legacy }}
        shell: bash
        run: |
          changed="$(git diff --name-only HEAD^ HEAD -- config/legacy-public-retirement.json)"
          if [ "$MANUAL_RETIRE" = "true" ] || [ "$changed" = "config/legacy-public-retirement.json" ]; then
            echo 'required=true' >> "$GITHUB_OUTPUT"
          else
            echo 'required=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Replace legacy dashboards with redirects once
        if: steps.legacy.outputs.required == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/retire-legacy-public.mjs
      - name: Preserve brand deployment verification receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: public-brand-sites-verification
          path: brand-publicmp/deployment-receipt.json
          if-no-files-found: ignore
